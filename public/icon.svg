<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#amberGrad)" stroke-width="8" opacity="0.35" />
  
  <!-- Ledger Notebook Icon Base -->
  <rect x="110" y="96" width="292" height="320" rx="32" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- Spine Line -->
  <line x1="160" y1="96" x2="160" y2="416" stroke="#475569" stroke-width="4" stroke-dasharray="8 8" />
  
  <!-- Rupee Symbol Symbol in Center -->
  <circle cx="280" cy="230" r="70" fill="url(#amberGrad)" />
  <text x="280" y="262" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="95" font-weight="900" fill="#0f172a" text-anchor="middle">₹</text>
  
  <!-- Ledger Rows Simulation -->
  <rect x="185" y="330" width="190" height="12" rx="6" fill="#475569" />
  <rect x="185" y="355" width="130" height="12" rx="6" fill="url(#emeraldGrad)" />
  
  <!-- Sparkle Badge -->
  <circle cx="380" cy="125" r="22" fill="url(#emeraldGrad)" />
  <text x="380" y="133" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
</svg>
